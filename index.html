<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Shark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <input class="nav-state" type="radio" name="nav" id="nav-home" checked />
    <input class="nav-state" type="radio" name="nav" id="nav-favorites" />

    <header class="header">
      <div class="wrapper">
        <div class="header-nav">
          <label
            for="nav-home"
            class="label-logo-wrapper"
            aria-label="Crypto Shark home "
          >
            <img src="images/logo.svg" alt="Crypto Shark logo" />
            <span class="logo-text">Crypto<b>Shark</b></span>
          </label>

          <div class="search-wrapper">
            <label for="coinSearch" class="visually-hidden">Search coins</label>
            <form role="search" class="search-box" id="searchForm">
              <svg
                class="search-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="1em"
                height="1em"
                viewBox="0 0 24 24"
              >
                <path d="M0 0h24v24H0z" fill="none" />
                <path
                  fill="currentColor"
                  d="M9.539 15.23q-2.398 0-4.065-1.666Q3.808 11.899 3.808 9.5t1.666-4.065T9.539 3.77t4.064 1.666T15.269 9.5q0 1.042-.369 2.017t-.97 1.668l5.909 5.907q.14.14.15.345q.009.203-.15.363q-.16.16-.354.16t-.354-.16l-5.908-5.908q-.75.639-1.725.989t-1.96.35m0-1q1.99 0 3.361-1.37q1.37-1.37 1.37-3.361T12.9 6.14T9.54 4.77q-1.991 0-3.361 1.37T4.808 9.5t1.37 3.36t3.36 1.37"
                />
              </svg>

              <input
                type="search"
                id="coinSearch"
                class="coin-search"
                name="search"
                placeholder="Search coin, e.g. BTC or Bitcoin"
                autocomplete="off"
              />

              <button
                class="clear-btn"
                type="button"
                aria-label="Clear search"
                hidden
              >
                <svg
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="1em"
                  height="1em"
                  viewBox="0 0 24 24"
                >
                  <path d="M0 0h24v24H0z" fill="none" />
                  <path
                    fill="currentColor"
                    d="m12 12.708l-5.246 5.246q-.14.14-.344.15t-.364-.15t-.16-.354t.16-.354L11.292 12L6.046 6.754q-.14-.14-.15-.344t.15-.364t.354-.16t.354.16L12 11.292l5.246-5.246q.14-.14.345-.15q.203-.01.363.15t.16.354t-.16.354L12.708 12l5.246 5.246q.14.14.15.345q.01.203-.15.363t-.354.16t-.354-.16z"
                  />
                </svg>
              </button>
            </form>
            <p id="searchHint" class="search-hint" hidden aria-live="polite">
              Type at least 3 characters to search.
            </p>
          </div>

          <nav id="nav-links">
            <label for="nav-home">Home</label>
            <label for="nav-favorites">Favorites</label>
          </nav>
        </div>
      </div>
    </header>

    <main class="page-spacing-top">
      <!-- HOME  -->
      <section id="page-home" class="page wrapper dashboard">
        <h1 class="dashboard-title">Overview</h1>
        <p id="loader" class="text-loader">Loading coins...</p>
        <p id="error-message" class="error-message" hidden>
          Failed to load data. Please try again.
        </p>
        <table id="coin-table" class="data-table" hidden>
          <thead>
            <tr>
              <th></th>
              <th>Symbol</th>
              <th>Price</th>
              <th>24h Change</th>
              <th>24h High</th>
              <th>24h Low</th>
              <th>24h Volume</th>
            </tr>
          </thead>
          <tbody id="coin-table-body">
            <!-- inserted rows by renderTable() -->
          </tbody>
        </table>
      </section>

      <!-- FAVORITES  -->
      <section id="page-favorites" class="page wrapper favorites">
        <h1 class="favorites-title">Favorites</h1>
        <p id="no-favorites-message" class="text-loader" hidden>
          There are no favorite coins yet.
        </p>

        <table id="favorites-table" class="data-table" hidden>
          <thead>
            <tr>
              <th></th>
              <th>Symbol</th>
              <th>Price</th>
              <th>24h Change</th>
              <th>24h High</th>
              <th>24h Low</th>
              <th>24h Volume</th>
            </tr>
          </thead>
          <tbody id="favorites-coin-table-body">
            <!-- inserted by renderFavoritesTable() -->
          </tbody>
        </table>
      </section>
    </main>

    <!-- modal window for the coin  -->
    <div id="depthModal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2 id="depthTitle">Order book</h2>
          <select id="depthLimit" class="depth-limit-select">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <button
            class="modal-close"
            data-action="close-depth"
            aria-label="Close order book"
          >
            &times;
          </button>
        </div>
        <div class="modal-body" id="depthBody">
          <!-- inserted by renderDepthBody()  -->
        </div>
      </div>
    </div>
    <script src="/js/script.js" defer></script>
  </body>
</html>
